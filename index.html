<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>環境雷達掃描：手機實境版</title>
    <style>
        :root {
            --bg-dark: #0a0a0f;
            --panel-bg: rgba(20, 20, 30, 0.95);
            --micro-color: #00f0ff;
            --macro-color: #ff0055;
            --text-main: #e2e8f0;
            --text-muted: #94a3b8;
            --border-color: #334155;
            --success: #10b981;
            --danger: #ef4444;
            --safe-bottom: env(safe-area-inset-bottom, 20px);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
            background: #0a0a0f;
            color: var(--text-main);
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
            /* 防止行動版下拉更新或反彈 */
            overscroll-behavior-y: none; 
        }

        /* 頂部狀態列 (Sticky) */
        .top-bar {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10, 10, 15, 0.9);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        .top-bar h1 { margin: 0; font-size: 1.1rem; color: #fff; }
        .score-box { font-size: 0.9rem; color: #fbbf24; font-weight: bold; }
        .timer-box { font-size: 1.2rem; font-weight: bold; color: var(--success); font-variant-numeric: tabular-nums; }
        .timer-box.danger { color: var(--danger); animation: pulse 0.5s infinite alternate; }

        @keyframes pulse { from { opacity: 1; } to { opacity: 0.5; } }

        /* 遊戲滾動區塊 (需預留底部卡片空間) */
        .game-scroll-area {
            padding: 15px 15px 200px 15px; /* 底部 padding 避免被卡片擋住 */
            flex-grow: 1;
            overflow-y: auto;
        }

        /* 雷達面板 */
        .radar-panel {
            background: rgba(255,255,255,0.02);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid var(--border-color);
        }

        .micro-panel { border-top: 3px solid var(--micro-color); }
        .macro-panel { border-top: 3px solid var(--macro-color); }

        .panel-title {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .micro-panel .panel-title { color: var(--micro-color); }
        .macro-panel .panel-title { color: var(--macro-color); }

        /* 點擊網格 */
        .slots-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
        }

        .tap-slot {
            background: rgba(0,0,0,0.5);
            border: 1px solid #475569;
            border-radius: 8px;
            padding: 12px 5px;
            text-align: center;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: 0.1s;
            /* 提升手機點擊體驗 */
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        .tap-slot:active {
            transform: scale(0.95);
            background: rgba(255,255,255,0.1);
        }

        .tap-slot span.zh { font-size: 0.95rem; font-weight: bold; color: #f8fafc; margin-bottom: 3px; }
        .tap-slot span.en { font-size: 0.65rem; color: var(--text-muted); }

        /* 底部固定情報卡 (Fixed) */
        .bottom-card-container {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--panel-bg);
            border-top: 1px solid var(--border-color);
            padding: 15px 15px var(--safe-bottom) 15px;
            box-sizing: border-box;
            box-shadow: 0 -10px 30px rgba(0,0,0,0.8);
            backdrop-filter: blur(15px);
            z-index: 50;
            transform: translateY(0);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .bottom-card-container.hidden {
            transform: translateY(150%);
        }

        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .card-tag { background: #334155; padding: 4px 10px; border-radius: 12px; font-size: 0.75rem; color: #cbd5e1; font-weight: bold;}
        .card-instruction { font-size: 0.75rem; color: var(--success); animation: flash 2s infinite; }

        @keyframes flash { 0%, 100% {opacity: 1;} 50% {opacity: 0.5;} }

        .event-text {
            font-size: 1.05rem;
            line-height: 1.5;
            color: #fff;
            margin: 0;
            font-weight: 500;
        }

        /* Toast & Modal */
        #feedback-toast {
            position: fixed; top: 60px; left: 50%; transform: translateX(-50%) translateY(-20px);
            padding: 10px 20px; border-radius: 20px; font-weight: bold; font-size: 0.9rem;
            color: #fff; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 999;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 85%; text-align: center; line-height: 1.4;
        }

        .modal-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 1000; justify-content: center; align-items: center;
            padding: 20px; box-sizing: border-box;
        }

        .modal-content {
            background: #1e293b; border: 1px solid var(--border-color); border-radius: 15px;
            padding: 30px 20px; width: 100%; text-align: center;
        }

        .btn {
            background: #fff; color: #000; border: none; padding: 15px; width: 100%;
            font-size: 1.1rem; font-weight: bold; border-radius: 8px; margin-top: 20px;
        }
    </style>
</head>
<body>

    <div class="top-bar">
        <div>
            <h1>📡 環境掃描</h1>
            <div class="score-box">積分: <span id="score">0</span></div>
        </div>
        <div class="timer-box" id="timer">90.0</div>
    </div>

    <div class="game-scroll-area">
        
        <div class="radar-panel micro-panel">
            <div class="panel-title">🎯 個體環境 (Micro)</div>
            <div class="slots-grid">
                <div class="tap-slot" onclick="placeCard('micro-company')"><span class="zh">公司</span><span class="en">Company</span></div>
                <div class="tap-slot" onclick="placeCard('micro-supplier')"><span class="zh">供應商</span><span class="en">Suppliers</span></div>
                <div class="tap-slot" onclick="placeCard('micro-intermediary')"><span class="zh">中間機構</span><span class="en">Intermediary</span></div>
                <div class="tap-slot" onclick="placeCard('micro-customer')"><span class="zh">顧客市場</span><span class="en">Customers</span></div>
                <div class="tap-slot" onclick="placeCard('micro-competitor')"><span class="zh">競爭者</span><span class="en">Competitors</span></div>
                <div class="tap-slot" onclick="placeCard('micro-public')"><span class="zh">公眾</span><span class="en">Publics</span></div>
            </div>
        </div>

        <div class="radar-panel macro-panel">
            <div class="panel-title">🌍 總體環境 (Macro)</div>
            <div class="slots-grid">
                <div class="tap-slot" onclick="placeCard('macro-demographic')"><span class="zh">人口統計</span><span class="en">Demographic</span></div>
                <div class="tap-slot" onclick="placeCard('macro-economic')"><span class="zh">經濟</span><span class="en">Economic</span></div>
                <div class="tap-slot" onclick="placeCard('macro-natural')"><span class="zh">自然</span><span class="en">Natural</span></div>
                <div class="tap-slot" onclick="placeCard('macro-tech')"><span class="zh">科技</span><span class="en">Tech</span></div>
                <div class="tap-slot" onclick="placeCard('macro-political')"><span class="zh">政治</span><span class="en">Political</span></div>
                <div class="tap-slot" onclick="placeCard('macro-cultural')"><span class="zh">文化</span><span class="en">Cultural</span></div>
            </div>
        </div>
        
    </div>

    <div class="bottom-card-container" id="card-container">
        <div class="card-header">
            <span class="card-tag" id="card-counter">情報 1/10</span>
            <span class="card-instruction">▲ 點擊上方區塊分類</span>
        </div>
        <p class="event-text" id="event-text">情報載入中...</p>
    </div>

    <div id="feedback-toast"></div>

    <div class="modal-overlay" id="modal">
        <div class="modal-content">
            <h2 id="modal-title" style="margin-top:0;">掃描完成</h2>
            <p id="modal-desc" style="font-size: 0.95rem; color: var(--text-muted); line-height: 1.5;"></p>
            <div style="font-size: 3.5rem; font-weight: bold; margin: 15px 0; color: #fbbf24;" id="final-score"></div>
            <button class="btn" onclick="location.reload()">重新執行任務</button>
        </div>
    </div>

<script>
    // 嚴格依據 CH03 簡報內容設計的題庫
    const eventsDB = [
        { id: 1, text: "公司的主要零件供應廠商突發罷工，導致生產線面臨斷鏈危機。", target: "micro-supplier", type: "個體-供應商", exp: "供應商直接影響公司運作，屬內部價值網絡。" },
        { id: 2, text: "網路上出現網紅針對本品牌產品品質的抱怨影片，引發公關危機。", target: "micro-public", type: "個體-公眾", exp: "社群公眾 (Publics) 屬於個體環境中的一環。" },
        { id: 3, text: "國內新生兒出生率創新低，導致嬰幼兒產品潛在市場萎縮。", target: "macro-demographic", type: "總體-人口統計", exp: "人口結構的長期變遷屬於不可控的總體因素。" },
        { id: 4, text: "政府突然通過新的嚴格環保法規，限制現有產品包裝材料的使用。", target: "macro-political", type: "總體-政治", exp: "政府法規與政治環境屬總體環境。" },
        { id: 5, text: "最大的連鎖經銷商要求提高分潤比例，否則將下架我們的產品。", target: "micro-intermediary", type: "個體-中間機構", exp: "經銷商屬於行銷中間機構 (Intermediaries)。" },
        { id: 6, text: "主要競爭對手突然宣布全線產品降價 30% 進行市場搶奪。", target: "micro-competitor", type: "個體-競爭者", exp: "競爭者的動態直接影響公司，屬個體環境。" },
        { id: 7, text: "央行宣布升息，導致民眾貸款壓力大增、可支配所得下降。", target: "macro-economic", type: "總體-經濟", exp: "利率與購買力屬於總體經濟環境。" },
        { id: 8, text: "年輕世代越來越重視「工作與生活平衡」的價值觀，不愛加班。", target: "macro-cultural", type: "總體-文化", exp: "次級信仰與社會價值觀的改變，屬文化環境。" },
        { id: 9, text: "生成式 AI 技術爆發，大幅降低了內容產製與程式開發的成本。", target: "macro-tech", type: "總體-科技", exp: "新科技發明會改變產業規則，屬科技環境。" },
        { id: 10, text: "聖嬰現象導致咖啡豆主產區發生嚴重旱災，全球原物料短缺。", target: "macro-natural", type: "總體-自然", exp: "氣候變遷與天然資源短缺屬自然環境。" },
        { id: 11, text: "公司財務部門決定縮減下一季的行銷預算。", target: "micro-company", type: "個體-公司", exp: "公司內部各部門（如財務）也是個體環境的一環。" },
        { id: 12, text: "主要B2B企業客戶因業績不佳，削減了對本公司的軟體採購量。", target: "micro-customer", type: "個體-顧客市場", exp: "顧客市場（包含企業客戶）屬個體環境。" }
    ];

    let gameCards = [];
    let currentCardIndex = 0;
    let score = 0;
    let timeLeft = 90.0;
    let timerId;
    let gameActive = true;
    let isProcessing = false; // 防止連續快點

    window.onload = () => {
        // 隨機挑選 10 題
        gameCards = [...eventsDB].sort(() => Math.random() - 0.5).slice(0, 10);
        loadNextCard();
        timerId = setInterval(updateTimer, 100);
    };

    function loadNextCard() {
        if (currentCardIndex >= gameCards.length) {
            endGame();
            return;
        }
        
        const cardData = gameCards[currentCardIndex];
        const container = document.getElementById('card-container');
        
        // 加上一點進場動畫特效
        container.classList.add('hidden');
        
        setTimeout(() => {
            document.getElementById('card-counter').innerText = `情報 ${currentCardIndex + 1}/${gameCards.length}`;
            document.getElementById('event-text').innerText = cardData.text;
            container.classList.remove('hidden');
            isProcessing = false;
        }, 300); // 等待卡片滑下再換字滑上
    }

    function updateTimer() {
        if (!gameActive) return;
        timeLeft -= 0.1;
        const timerEl = document.getElementById('timer');
        
        if (timeLeft <= 0) {
            timeLeft = 0;
            timerEl.innerText = "0.0";
            endGame(true);
        } else {
            timerEl.innerText = timeLeft.toFixed(1);
            if (timeLeft <= 15.0) timerEl.classList.add('danger');
        }
    }

    function placeCard(slotId) {
        if (!gameActive || isProcessing) return;
        isProcessing = true; // 鎖定點擊

        const currentCard = gameCards[currentCardIndex];
        const targetId = currentCard.target;
        const typeName = currentCard.type;
        const exp = currentCard.exp;

        // 判斷是否為「大類正確」
        const isMicroSlot = slotId.startsWith("micro");
        const isMicroTarget = targetId.startsWith("micro");
        const sameMajorCategory = (isMicroSlot && isMicroTarget) || (!isMicroSlot && !isMicroTarget);

        // 震動回饋 (如果手機支援)
        if (navigator.vibrate) navigator.vibrate(50);

        if (slotId === targetId) {
            score += 100;
            showToast(`✅ 精準命中！${typeName}`, true);
        } else if (sameMajorCategory) {
            score += 20;
            showToast(`⚠️ 粗略命中！同大類但應為：${typeName}<br><span style="font-size:0.75rem">${exp}</span>`, false);
        } else {
            score -= 30;
            if (navigator.vibrate) navigator.vibrate([50, 50, 50]); // 錯誤震動
            showToast(`❌ 嚴重誤判！正確為：${typeName}<br><span style="font-size:0.75rem">${exp}</span>`, false);
        }

        document.getElementById('score').innerText = score;
        
        currentCardIndex++;
        loadNextCard();
    }

    function showToast(msg, isSuccess) {
        const toast = document.getElementById('feedback-toast');
        toast.innerHTML = msg;
        toast.style.background = isSuccess ? "var(--success)" : "var(--danger)";
        toast.style.opacity = "1";
        toast.style.transform = "translateX(-50%) translateY(0)";
        
        setTimeout(() => {
            toast.style.opacity = "0";
            toast.style.transform = "translateX(-50%) translateY(-20px)";
        }, 2500);
    }

    function endGame(isTimeout = false) {
        gameActive = false;
        clearInterval(timerId);
        
        document.getElementById('card-container').classList.add('hidden'); // 隱藏底部卡片
        
        const modal = document.getElementById('modal');
        const title = document.getElementById('modal-title');
        const desc = document.getElementById('modal-desc');
        const scoreDisplay = document.getElementById('final-score');

        // 時間紅利
        let timeBonus = isTimeout ? 0 : Math.floor(timeLeft) * 2;
        let finalScore = Math.max(0, score + timeBonus);

        scoreDisplay.innerText = finalScore;

        if (finalScore >= 900) {
            title.innerText = "🏆 首席戰略長";
            title.style.color = "var(--success)";
            desc.innerHTML = `完美掃描！你成功區分了價值網絡（個體）與社會趨勢（總體）的界線。<br><br>含時間紅利：${timeBonus}分`;
        } else if (finalScore >= 500) {
            title.innerText = "👍 資深行銷經理";
            title.style.color = "var(--micro-color)";
            desc.innerHTML = `表現不錯！大部分的情報都分類正確，但仍有少部分次級指標被混淆。<br><br>含時間紅利：${timeBonus}分`;
        } else {
            title.innerText = "💥 雷達系統紊亂";
            title.style.color = "var(--danger)";
            desc.innerHTML = `你似乎將內部可控的「個體成員」與外部不可控的「總體趨勢」搞混了，請重新複習簡報。`;
        }

        modal.style.display = "flex";
    }
</script>

</body>
</html>
